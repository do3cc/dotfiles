---
# packages.yaml - Shared package manifest for dotfiles
#
# This file is the single source of truth for package definitions.
# Used by:
#   - src/dotfiles/init.py (Python installation script)
#   - local_bin/run-claude.sh (Docker image build)

# Base packages for all Linux systems
base:
  arch:
    - ast-grep
    - bat
    - bitwarden
    - direnv
    - eza
    - fd
    - firefox
    - fish
    - ghostscript
    - ghostty
    - git
    - github-cli
    - glab
    - htop
    - imagemagick
    - jdk-openjdk
    - jq
    - texlive-latex
    - lazygit
    - less
    - lua51
    - luarocks
    - man-db
    - markdownlint-cli2
    - mermaid-cli
    - neovim
    - nmap
    - noto-fonts-emoji
    - npm
    - otf-font-awesome
    - pacman-contrib
    - prettier
    - python-gobject
    - python-pip
    - rsync
    - shfmt
    - starship
    - stylua
    - syncthing
    - tailscale
    - tectonic
    - the_silver_searcher
    - tig
    - tealdeer
    - tree-sitter-cli
    - uv
    - wget
    - yarn

  debian:
    - ack
    - apt-file
    - build-essential
    - curl
    - direnv
    - fish
    - jq
    - libbz2-dev
    - libffi-dev
    - libfuse2
    - liblzma-dev
    - libncursesw5-dev
    - libreadline-dev
    - libsqlite3-dev
    - libssl-dev
    - libxml2-dev
    - libxmlsec1-dev
    - neovim
    - nmap
    - npm
    - silversearcher-ag
    - syncthing
    - tig
    - tk-dev
    - xz-utils
    - zlib1g-dev

# AUR packages (Arch only)
aur:
  base:
    - google-java-format
    - nodejs-markdown-toc
